name: Build RJ APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RJ project
        run: |
          unzip -q RJ_Version3_GitHub_Build.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Fix Java and Kotlin targets
        run: |
          cat > project/RJ_Android_App/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rj.password"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.rj.password"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build RJ APK
        working-directory: project/RJ_Android_App
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload RJ APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Version3-APK
          path: project/RJ_Android_App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
